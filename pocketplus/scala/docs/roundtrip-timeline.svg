<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrPkt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/>
    </marker>
  </defs>

  <rect width="1120" height="620" fill="#ffffff"/>

  <!-- ===== timelines ===== -->
  <text x="20" y="166" font-size="18" font-weight="bold" fill="#1565c0">Encoder</text>
  <line x1="110" y1="160" x2="1085" y2="160" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="20" y="346" font-size="18" font-weight="bold" fill="#e65100">Decoder</text>
  <line x1="110" y1="340" x2="1085" y2="340" stroke="#e65100" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="1085" y="145" font-size="15" fill="#555" text-anchor="end" font-style="italic">time →</text>

  <!-- ===== encoder inputs (from above) ===== -->
  <g font-size="15" fill="#222" text-anchor="middle">
    <text x="210" y="80">Iₜ</text>
    <text x="210" y="100" font-size="13" fill="#555">pₜ, fₜ, rₜ, Rₜ</text>
    <text x="490" y="80">Iₜ₊₁</text>
    <text x="490" y="100" font-size="13" fill="#555">pₜ₊₁, fₜ₊₁, rₜ₊₁, Rₜ₊₁</text>
    <text x="770" y="80">Iₜ₊₂</text>
    <text x="770" y="100" font-size="13" fill="#555">pₜ₊₂, fₜ₊₂, rₜ₊₂, Rₜ₊₂</text>
  </g>
  <g stroke="#333" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="210" y1="108" x2="210" y2="138"/>
    <line x1="490" y1="108" x2="490" y2="138"/>
    <line x1="770" y1="108" x2="770" y2="138"/>
  </g>

  <!-- ===== encoder steps ===== -->
  <g fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5">
    <rect x="145" y="140" width="130" height="40" rx="6"/>
    <rect x="425" y="140" width="130" height="40" rx="6"/>
    <rect x="705" y="140" width="130" height="40" rx="6"/>
  </g>
  <g font-size="15" fill="#0d1b2a" text-anchor="middle">
    <text x="210" y="165">Encoder.step</text>
    <text x="490" y="165">Encoder.step</text>
    <text x="770" y="165">Encoder.step</text>
  </g>

  <!-- encoder states, below the line -->
  <g font-size="16" fill="#1565c0" text-anchor="middle">
    <text x="125" y="200">Sₜ</text>
    <text x="350" y="200">Sₜ₊₁</text>
    <text x="630" y="200">Sₜ₊₂</text>
    <text x="930" y="200">…</text>
  </g>

  <!-- ===== initial synchronization ===== -->
  <line x1="125" y1="208" x2="125" y2="334" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="133" y="275" font-size="13" fill="#666">decoderView</text>

  <!-- ===== packets on the channel (slanted: decoding happens later) ===== -->
  <g stroke="#6a1b9a" stroke-width="2" marker-end="url(#arrPkt)">
    <line x1="230" y1="180" x2="335" y2="318"/>
    <line x1="510" y1="180" x2="615" y2="318"/>
    <line x1="790" y1="180" x2="895" y2="318"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#6a1b9a">
    <text x="292" y="245">oₜ</text>
    <text x="572" y="245">oₜ₊₁</text>
    <text x="852" y="245">oₜ₊₂</text>
  </g>

  <!-- ===== decoder steps ===== -->
  <g fill="#fff3e0" stroke="#e65100" stroke-width="1.5">
    <rect x="285" y="320" width="130" height="40" rx="6"/>
    <rect x="565" y="320" width="130" height="40" rx="6"/>
    <rect x="845" y="320" width="130" height="40" rx="6"/>
  </g>
  <g font-size="15" fill="#0d1b2a" text-anchor="middle">
    <text x="350" y="345">Decoder.step</text>
    <text x="630" y="345">Decoder.step</text>
    <text x="910" y="345">Decoder.step</text>
  </g>

  <!-- decoder states, below the line -->
  <g font-size="16" fill="#e65100" text-anchor="middle">
    <text x="200" y="382">σₜ</text>
    <text x="490" y="382">σₜ₊₁</text>
    <text x="770" y="382">σₜ₊₂</text>
    <text x="1030" y="382">…</text>
  </g>

  <!-- decoder outputs -->
  <g stroke="#333" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="350" y1="362" x2="350" y2="410"/>
    <line x1="630" y1="362" x2="630" y2="410"/>
    <line x1="910" y1="362" x2="910" y2="410"/>
  </g>
  <g font-size="16" fill="#222" text-anchor="middle">
    <text x="350" y="432">Iₜ'</text>
    <text x="630" y="432">Iₜ₊₁'</text>
    <text x="910" y="432">Iₜ₊₂'</text>
  </g>

  <!-- ===== theorems ===== -->
  <g fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5">
    <rect x="110" y="470" width="440" height="90" rx="8"/>
    <rect x="575" y="470" width="505" height="90" rx="8"/>
  </g>
  <g fill="#1b3d1f" text-anchor="middle">
    <text x="330" y="500" font-size="17" font-weight="bold">mainRoundTripTheorem</text>
    <text x="330" y="526" font-size="15">the decoder gives back the input</text>
    <text x="330" y="548" font-size="16">Iₜ' = Iₜ</text>
    <text x="827" y="500" font-size="17" font-weight="bold">mainStateSynchronizationTheorem</text>
    <text x="827" y="526" font-size="15">the decoder state stays in sync with the encoder</text>
    <text x="827" y="548" font-size="16">σₜ₊₁ = decoderView(Sₜ₊₁)</text>
  </g>
  <text x="595" y="595" font-size="14" fill="#555" text-anchor="middle" font-style="italic">for every state Sₜ, input Iₜ and parameters that meet Encoder.step's preconditions, with σₜ = decoderView(Sₜ)</text>
</svg>
