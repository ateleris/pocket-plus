
# The settings below correspond to the various
# options listed by `stainless --help`

vc-cache            = true
# debug               = ["verification", "smt"]
timeout             = 300
check-models        = false
print-ids           = false
print-types         = false
batched             = true
strict-arithmetic   = true
solvers             = "smt-z3,smt-cvc5,princess"
check-measures      = yes
infer-measures      = true
simplifier           = "bland"
