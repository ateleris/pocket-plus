name: Set up Java and Stainless
description: >-
  JDK 25 plus the Stainless release pinned by pocketplus/install.sh, installed into
  pocketplus/tools/stainless. Needs the repository checked out first.

inputs:
  platform:
    description: The install.sh platform (linux, mac-arm64, mac-x86 or win).
    required: true

runs:
  using: composite
  steps:
    # The JVM args used for GenC/verification (--sun-misc-unsafe-memory-access) need JDK 23+.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "25"

    - name: Install Stainless
      if: runner.os != 'Windows'
      shell: bash
      working-directory: pocketplus
      run: ./install.sh ${{ inputs.platform }}

    - name: Install Stainless (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      working-directory: pocketplus
      run: powershell -File install.ps1
