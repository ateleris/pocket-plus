name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest # arm64
            platform: mac-arm64
          - os: macos-15-intel # x86_64; label available until Aug 2027
            platform: mac-x86
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Cache for the verification step below (Linux-only, like that step); VC results
      # are content-addressed, so a stale cache still speeds up re-runs.
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: build/.stainless-cache
          key: stainless-vc-cache-${{ matrix.os }}-${{ hashFiles('scala/PocketPlus.scala') }}
          restore-keys: stainless-vc-cache-${{ matrix.os }}-

      # The JVM args used for GenC/verification (--sun-misc-unsafe-memory-access) need JDK 23+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stainless
        if: runner.os != 'Windows'
        run: ./install.sh ${{ matrix.platform }}
      - name: Install Stainless (Windows)
        if: runner.os == 'Windows'
        run: powershell -File install.ps1

      - name: Build native library
        if: runner.os != 'Windows'
        run: ./native/build.sh
      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        run: powershell -File native\build.ps1

      - name: Install Python test dependencies
        run: pip install -r python/requirements.txt

      - name: Run tests
        working-directory: python
        run: pytest -m "not verify"

      # Linux-only (verification is slow, and one OS gives enough signal). Allowed to
      # fail: the gate is red by design until verification invariants are added.
      - name: Run Stainless verification gate
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: python
        run: pytest -s -m verify
