name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest # arm64
            platform: mac-arm64
          - os: macos-15-intel # x86_64; label available until Aug 2027
            platform: mac-x86
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pocketplus
    steps:
      - uses: actions/checkout@v4
      # The JVM args used for GenC/verification (--sun-misc-unsafe-memory-access) need JDK 23+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stainless
        if: runner.os != 'Windows'
        run: ./install.sh ${{ matrix.platform }}
      - name: Install Stainless (Windows)
        if: runner.os == 'Windows'
        run: powershell -File install.ps1

      # native/generated/ is committed so that each commit shows how the C changes, and the build only
      # runs GenC when the Scala is newer than the C, which a fresh checkout does not tell. Regenerate
      # here, so that GenC is exercised and a commit that forgot to regenerate fails.
      # Linux-only: one OS gives enough signal. On the others, the build regenerates the C or uses the
      # committed one, depending on the file times the checkout happens to write.
      - name: Check that the committed generated C is up to date
        if: runner.os == 'Linux'
        run: |
          rm -f native/generated/pocketplus.c native/generated/pocketplus.h
          ./native/build.sh
          git diff --exit-code -- native/generated || {
            echo "native/generated is stale: run ./native/build.sh and commit the result." >&2
            exit 1
          }

      # C99 + -Werror lint flags live in the build scripts themselves (see native/build.sh and
      # native/pocketplus.vcxproj), so every job below is also the lint gate for its compiler:
      # gcc on Linux, Apple clang on macOS, clang-cl on Windows.
      - name: Build native library
        if: runner.os != 'Windows'
        run: ./native/build.sh
      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        run: powershell -File native\build.ps1

      - name: Install Python test dependencies
        run: pip install -r python/requirements.txt

      - name: Run tests
        working-directory: pocketplus/python
        run: pytest -m "not verify"

      # Second compiler on the same OS: gcc and clang warn about disjoint things, so building
      # once more with clang widens the lint coverage. Runs after the tests so the library they
      # loaded is the one the primary compiler produced.
      - name: Lint with the second C compiler (clang)
        if: runner.os == 'Linux'
        run: CC=clang ./native/build.sh

      # Linux-only (verification is slow, and one OS gives enough signal).
      - name: Run Stainless verification gate
        if: runner.os == 'Linux'
        working-directory: pocketplus/python
        env:
          # One VC at a time: see N_THREADS in python/pocketplus/verify.py.
          POCKETPLUS_VERIFY_PARALLEL: "1"
        run: pytest -s -m verify
