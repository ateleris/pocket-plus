<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrPkt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a1b9a"/>
    </marker>
  </defs>

  <rect width="1200" height="770" fill="#ffffff"/>

  <!-- ===== timelines ===== -->
  <text x="20" y="181" font-size="18" font-weight="bold" fill="#1565c0">Encoder</text>
  <line x1="110" y1="175" x2="150" y2="175" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="600" y1="175" x2="1165" y2="175" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1165" y="160" font-size="15" fill="#555" text-anchor="end" font-style="italic">time →</text>

  <text x="20" y="461" font-size="18" font-weight="bold" fill="#e65100">Decoder</text>
  <line x1="110" y1="455" x2="640" y2="455" stroke="#e65100" stroke-width="2.5"/>
  <line x1="1090" y1="455" x2="1165" y2="455" stroke="#e65100" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ===== encoder inputs ===== -->
  <text x="375" y="45" font-size="16" fill="#222" text-anchor="middle">input Iₜ</text>
  <text x="375" y="64" font-size="13" fill="#555" text-anchor="middle">parameters pₜ, fₜ, rₜ, Rₜ</text>
  <line x1="375" y1="70" x2="375" y2="93" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== Encoder.step ===== -->
  <rect x="150" y="95" width="450" height="160" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="375" y="118" font-size="16" font-weight="bold" fill="#0d1b2a" text-anchor="middle">Encoder.step</text>
  <rect x="162" y="128" width="426" height="117" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="375" y="146" font-size="14" font-weight="bold" fill="#1565c0" text-anchor="middle">outputVector</text>

  <g fill="#e3f2fd" stroke="#90caf9" stroke-width="1">
    <rect x="197" y="156" width="118" height="22" rx="4"/>
    <rect x="323" y="156" width="118" height="22" rx="4"/>
    <rect x="449" y="156" width="48" height="22" rx="4"/>
    <rect x="505" y="156" width="48" height="22" rx="4"/>
    <rect x="173" y="186" width="98" height="22" rx="4"/>
    <rect x="279" y="186" width="74" height="22" rx="4"/>
    <rect x="361" y="186" width="74" height="22" rx="4"/>
    <rect x="443" y="186" width="134" height="22" rx="4"/>
  </g>
  <g font-size="11" fill="#0d1b2a" text-anchor="middle">
    <text x="256" y="171">updateMaskAndBuild</text>
    <text x="382" y="171">updateChangeVector</text>
    <text x="473" y="171">compVt</text>
    <text x="529" y="171">compDt</text>
    <text x="222" y="201">runLengthEncode</text>
    <text x="316" y="201">encodeNBits</text>
    <text x="398" y="201">countEncode</text>
    <text x="510" y="201">bitExtractionFunction</text>
  </g>
  <text x="375" y="233" font-size="13" fill="#333" text-anchor="middle">→ oₜ = hₜ ‖ qₜ ‖ uₜ   (and Bₜ, Mₜ, Dₜ for Sₜ₊₁)</text>

  <!-- encoder states -->
  <text x="128" y="203" font-size="17" fill="#1565c0" text-anchor="middle">Sₜ</text>
  <text x="880" y="203" font-size="17" fill="#1565c0" text-anchor="middle">Sₜ₊₁</text>

  <!-- ===== initial view ===== -->
  <line x1="128" y1="212" x2="128" y2="449" stroke="#888" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="137" y="335" font-size="13" fill="#666">decoderView</text>

  <!-- ===== packet ===== -->
  <line x1="560" y1="255" x2="700" y2="373" stroke="#6a1b9a" stroke-width="2.2" marker-end="url(#arrPkt)"/>
  <text x="648" y="303" font-size="18" font-weight="bold" fill="#6a1b9a">oₜ</text>

  <!-- ===== Decoder.step ===== -->
  <rect x="640" y="375" width="450" height="160" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="865" y="398" font-size="16" font-weight="bold" fill="#0d1b2a" text-anchor="middle">Decoder.step</text>
  <rect x="652" y="408" width="426" height="117" rx="6" fill="#ffffff" stroke="#e65100" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="865" y="426" font-size="14" font-weight="bold" fill="#e65100" text-anchor="middle">decodeOutputVector</text>

  <g fill="#fff3e0" stroke="#ffcc80" stroke-width="1">
    <rect x="704" y="436" width="134" height="22" rx="4"/>
    <rect x="846" y="436" width="98" height="22" rx="4"/>
    <rect x="952" y="436" width="74" height="22" rx="4"/>
    <rect x="698" y="466" width="110" height="22" rx="4"/>
    <rect x="816" y="466" width="128" height="22" rx="4"/>
    <rect x="952" y="466" width="80" height="22" rx="4"/>
  </g>
  <g font-size="11" fill="#0d1b2a" text-anchor="middle">
    <text x="771" y="451">runLengthEncodingSize</text>
    <text x="895" y="451">runLengthDecode</text>
    <text x="989" y="451">decodeNBits</text>
    <text x="753" y="481">countDecodePrefix</text>
    <text x="880" y="481">bitInsertionFunction</text>
    <text x="992" y="481">maskFromDiff</text>
  </g>
  <text x="865" y="513" font-size="13" fill="#333" text-anchor="middle">→ Some(Iₜ', Mₜ), or None if oₜ is malformed</text>

  <!-- decoder states -->
  <text x="370" y="483" font-size="17" fill="#e65100" text-anchor="middle">σₜ = decoderView(Sₜ)</text>
  <text x="1128" y="483" font-size="17" fill="#e65100" text-anchor="middle">σₜ₊₁</text>

  <!-- decoder output -->
  <line x1="865" y1="537" x2="865" y2="572" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="865" y="595" font-size="16" fill="#222" text-anchor="middle">decoded input Iₜ'</text>

  <!-- ===== theorems ===== -->
  <g fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5">
    <rect x="110" y="620" width="470" height="90" rx="8"/>
    <rect x="620" y="620" width="545" height="90" rx="8"/>
  </g>
  <g fill="#1b3d1f" text-anchor="middle">
    <text x="345" y="650" font-size="17" font-weight="bold">mainRoundTripTheorem</text>
    <text x="345" y="676" font-size="15">the decoder gives back the input</text>
    <text x="345" y="698" font-size="16">Iₜ' = Iₜ</text>
    <text x="892" y="650" font-size="17" font-weight="bold">mainStateSynchronizationTheorem</text>
    <text x="892" y="676" font-size="15">the decoder state stays in sync with the encoder</text>
    <text x="892" y="698" font-size="16">σₜ₊₁ = decoderView(Sₜ₊₁)</text>
  </g>
  <text x="637" y="745" font-size="14" fill="#555" text-anchor="middle" font-style="italic">for every state Sₜ, input Iₜ and parameters that meet Encoder.step's preconditions</text>
</svg>
