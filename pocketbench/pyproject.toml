[project]
name = "pocketbench"
version = "0.1.0"
description = "Test, validate, profile and visualize CCSDS 124.0-B-1 (POCKET+) implementations across languages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "psutil>=5.9",
    "matplotlib>=3.8",
    "rich>=13.7",
]

[project.optional-dependencies]
# `to_dataframe()` imports pandas lazily, so it is not a core runtime dependency. jinja2 backs
# pandas' DataFrame.style, which notebooks/example.ipynb uses.
notebook = [
    "pandas>=2.0",
    "jinja2>=3.0",
]

[project.scripts]
pocket-bench = "pocketbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pandas>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
